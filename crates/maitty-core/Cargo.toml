[package]
name = "maitty-core"
version = "0.51.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
test = true
doctest = false

[dependencies]
maitty-shared = { path = "../maitty-shared" }
maitty-agent-detection = { path = "../maitty-agent-detection" }
maitty-agent-integrations = { path = "../maitty-agent-integrations" }
maitty-ipc-transport = { path = "../maitty-ipc-transport" }
maitty-settings = { path = "../maitty-settings" }
maitty-provider-codex = { path = "../adapters/maitty-provider-codex" }
maitty-provider-claude = { path = "../adapters/maitty-provider-claude" }
anyhow = "1"
bytes = "1"
directories = "6"
getrandom = "0.3"
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
ignore = "0.4"
interprocess = { version = "2", features = ["tokio"] }
portable-pty = "0.9"
regex = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sysinfo = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1"
vt100 = "0.16"

[dev-dependencies]
tokio = { version = "1", features = ["fs"] }
ratatui = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
