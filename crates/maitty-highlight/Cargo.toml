[package]
name = "maitty-highlight"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# fancy-regex keeps the grammars pure Rust: no C library to cross-compile for musl, ARM or macOS.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
