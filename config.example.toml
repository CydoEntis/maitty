# maitty configuration
# Location: %APPDATA%\maitty\config.toml on Windows, ~/.config/maitty/config.toml elsewhere
# (override with MAITTY_CONFIG). Every key is optional; reload with <prefix> Ctrl+R.

prefix = "ctrl+space"

# Browse all built-in names in Settings > Appearance > Theme.
# The app's own pair is night (the default) and day; the rest: docs/theme-credits.md.
theme = "night"

# Shell for new panes. Default: pwsh / powershell on Windows, $SHELL elsewhere.
# shell = "pwsh.exe"
# shell_args = ["-NoLogo"]

# Editor for "open in editor" (e). Empty: $VISUAL, $EDITOR, then code.
# editor = "nvim"

scrollback = 10000          # lines kept per pane in the client
replay_bytes = 2097152      # output kept per pane by the daemon, replayed on reattach

# Extra environment for every pane.
[env]
# EDITOR = "nvim"

# Any theme colour, as "#rrggbb", a 0-255 palette index, or a name.
[theme_overrides]
# accent = "#ff9e64"
# working = "#e0af68"
# blocked = "#f7768e"
# done = "#7dcfff"
# idle = "#9ece6a"
# border = "#3b4261"
# border_active = "#7aa2f7"
# sidebar_bg = "#16161e"

[ui]
start_dir = ""              # where plain `maitty` opens, e.g. "~/code" (empty: where you run it)
sidebar_tabs = "all"        # all | busy | off: a session's tabs as lines under its row
alt_keys = true             # Alt+n shell, Alt+a session, Alt+x close, Alt+s / Alt+d split side by side / down, without the leader
sidebar = true              # <leader> z collapses it
sidebar_position = "left"   # left | right
layout = "floating"         # floating | hairline (older tiled, grid, compact, cards, flat still read)
pane_colors = false         # floating: each pane's border in its own colour
rounded = "off"             # full (needs a Nerd Font) | corners | off; hairline is always square (older `corners = "rounded"` still read)
# padding = "top"           # top (a row above only) | 0 | 1 | 2: space round the screen
# background = "solid"      # solid: paint the theme everywhere | terminal: your terminal's (transparent, image) shows through
# cursor = "terminal"       # terminal | block | underline | bar, when a pane's program picks none
# cursor_blink = true
glyphs = "auto"             # auto | dots | unicode | ascii | nerd: session and check marks (auto: dots, or ascii when [icons] are)
which_key = false         # Settings: "Leader waits for next key"; list every key if you pause after the leader (? always shows them)
which_key_delay_ms = 600
mouse = true
subagent_count = true       # show "· N agents" on a working session row when the agent reports helpers
# Working spinner: Settings > Appearance > Working spinner has animated previews.
# spinner = ["|", "/", "-", "\\"] # custom frames, each one terminal column
# spinner = []              # static icons.working; at most 64 custom frames
workspace_colors = ["#89b4fa", "#a6e3a1", "#cba6f7", "#fab387", "#94e2d5", "#f5c2e7", "#f9e2af", "#f38ba8"]

# Settings > Sessions. `helpers`: may a session start helpers (other agents through `maitty mcp`)?
# ask puts the question on the session's row the first time; Always in this project is
# remembered in helper-projects.json in Maitty's data folder. `helpers_at_once` is per session.
# (An old [mcp] helpers_at_once is used until this is set.)
[sessions]
agent = "last used"         # last used | claude | codex | gemini
where = "new worktree"      # new worktree | this folder
helpers = "ask"             # ask | always | never
helpers_at_once = "3"       # 2 | 3 | 4

[restore]
enabled = true              # rebuild workspaces / tabs / panes when the server starts
agents = true               # resume agents (claude --resume <id>, codex resume --last, ...)
commands = true             # re-run commands panes were started with
output = true               # keep each pane's recent output on disk (may hold secrets; false deletes it)

[quick]
place = "worktree"          # right | down | tab | worktree | here
agents = [
  { name = "claude", command = "claude {prompt}" },
  { name = "codex", command = "codex {prompt}" },
]

[worktree]
per_agent = true            # new claude/codex panes get their own worktree in a git repo
dir = "{repo_parent}/{repo}-worktrees/{branch}"
command = ""                # e.g. "claude" to start an agent in every new worktree
prewarm = ""                # e.g. "claude": keep one booted in a spare worktree so + New is instant

[icons]
working = "⠹"
blocked = "●"
done = "●"                  # same as blocked, told apart by colour (green)
idle = "○"
shell = ""                  # a terminal (Nerd Font); ">" or "$" without one
branch = "\ue0a0 "          # Nerd Font branch glyph; use "" or "on " without one

[snapshots]
enabled = true              # keep a checkout's files as they were when an agent's turn begins; restore from its menu

[notify]
sound = true                # maitty's own sounds when an agent you're not looking at needs you or finishes
# phone_topic = "maitty-pick-something-unguessable"   # ntfy app topic; empty is off
# phone_after = 60          # seconds an agent waits unanswered before your phone buzzes
# phone_done = false        # also when one finishes and nobody looked
# phone_text = false        # include what it's doing (the topic name is the only secret)
# phone_server = "https://ntfy.sh"

[detection]
working_window_ms = 1500
echo_grace_ms = 300
scan_interval_ms = 1000
pattern_rows = 12

# Bindings after the prefix. Merged over the defaults; "none" unbinds a default.
# Actions: split-right split-down split-left split-up close-pane close-split
#   focus-{left,right,up,down} focus-next focus-prev resize-{left,right,up,down}
#   new-tab next-tab prev-tab close-tab rename-tab select-tab-N
#   new-workspace close-workspace rename-workspace
#   toggle-sidebar hide-sidebar browse-tree side-up side-down scroll-up scroll-down
#   copy-mode search prev-prompt next-prompt
#   shell-here start-session new-pane new-session message stop-agent why jump history
#   files find-file search-code changes branch worktrees new-worktree new-worktree:<cmd>
#   remove-worktree tidy-worktrees paste-image
#   palette menu settings help agent-status-setup pane-info
#   detach reload-config send-prefix kill-server update check-update restart
#   spawn-right:<cmd> spawn-down:<cmd> spawn-left:<cmd> spawn-up:<cmd> spawn-tab:<cmd>
# Examples, commented out so the defaults stay as they are:
[keys.prefix]
# C = "spawn-right:claude"   # Shift+C: claude in a split beside you
# O = "spawn-down:codex"     # Shift+O: codex in a split below
# A = "new-worktree:claude"  # Shift+A: worktree picker; whatever you open or create starts claude
# g = "spawn-tab:lazygit"    # lazygit in a new tab; takes `g` from Worktrees

# Bindings that work without the prefix (they're taken from the program in the pane).
[keys.global]
# "alt+h" = "focus-left"     # Alt+h/j/k/l move between panes, and programs no longer get them
# "alt+j" = "focus-down"
# "alt+k" = "focus-up"
# "alt+l" = "focus-right"

# Agents are detected from the pane's process tree. Entries here merge over the
# built-ins by name: claude, codex, gemini, opencode, cursor, copilot, amp, qwen, aider,
# goose, crush, droid, pi, kiro, grok, auggie, kimi, deepseek, devin, agy, cline, omp,
# mastracode, hermes, kilo, qodercli, letta, maki, muse. Patterns are case-insensitive regexes
# matched against the bottom of the screen; hooks (`maitty integrate claude`)
# override them with exact lifecycle events.
# [[agents]]
# name = "my-agent"
# process = ["my-agent"]
# cmdline = ["my-agent/cli.js"]
# working_patterns = ["esc to interrupt"]
# blocked_patterns = ["\\(y/n\\)"]
# resume = "my-agent --resume {session}"   # {session} comes from hooks
# resume_last = "my-agent --continue"
#
# [[agents]]
# name = "goose"
# enabled = false


# [[recipes]]
# name = "feature"
# worktree = true
# run = ["claude", "npm run dev", "lazygit"]

# Per-repo settings go in the repo, in a .maitty.toml file (commit it to share them):
#   [hooks]
#   on_create = "npm install"        # runs in each new worktree ($MAITTY_BRANCH, $MAITTY_WORKTREE, ...)
#   on_remove = ""                   # runs before a worktree is removed

# Checks: when an agent's turn ends in a project listed here, Maitty runs `command` through
# your shell in that session's worktree and records the result. `project` is the repo's
# main checkout. A project may list several
# checks (checkpoints), each with its own `name` (default: the command's last word, so
# "npm test" is `test`); two in one project may not share a name.
# `timeout_s` (default 600) stops a run that hangs, and its whole process tree with it.
# The command does not get the pane's MAITTY_PANE_TOKEN, and its output stays on the daemon.
# Several run in the order listed, each whatever the one before it returned; the session
# reads done only when every one passed (or you overrode it).
# [[check]]
# project = "/home/me/code/app"
# name = "build"
# command = "npm run build"
# [[check]]
# project = "/home/me/code/app"
# name = "test"
# command = "npm test"
# timeout_s = 600
# Settings > Check edits this table for the project you are in and keeps your comments.
#
# A repo can name its own checks in .maitty/checks.toml (same keys, no `project`). Maitty
# reads it only for a project with no [[check]] here: yours win and the file is then ignored.
# None of its commands runs until you approve it from a Maitty window (once, always, or never
# for this repo); an Always holds for that exact command, so a changed command asks again.
# Your answers are kept in check-approvals.json in Maitty's data folder, not in the repo.
#   # .maitty/checks.toml
#   [[check]]
#   name = "build"
#   command = "cargo build"
#
#   [[check]]
#   name = "test"
#   command = "cargo test"
#   timeout_s = 900

# Presets: saved launches, offered as ★ choices in the new-agent dialog. `{task}` is what
# you type. where = send (tell the agent you're on) | beside (a new one in its folder) |
# worktree (a new one in a new worktree).
# [[presets]]
# name = "commit and push"
# agent = "claude"
# prompt = "Commit all changes with a clear message, then push."
# where = "send"
#
# [[presets]]
# name = "review"
# agent = "claude"
# model = "opus"
# prompt = "Review {task} for bugs and risky changes. Don't edit anything."
# where = "worktree"

[mcp]
approve = "never"       # may agents (through `maitty mcp`) answer "yes" to prompts? never | safe | always
scope = "project"       # project | all
