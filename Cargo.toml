[package]
name = "maitty"
version = "0.51.0"
edition = "2024"
description = "All agents on deck: run many coding agents side by side, see which need you, keep them running when you leave"
license = "MIT"

# The app's name lives here and nowhere else (ADR 0019): the package name above is the command,
# and build.rs hands these to the code as APP_NAME, APP_TAGLINE, APP_COMMAND, APP_ENV and
# APP_PREVIOUS.
[package.metadata.brand]
name = "Maitty"
# A few words under the name: the splash and the README.
tagline = "All agents on deck"
# Commands the app had before, newest first: what an old install left is carried over.
previous = ["vibecasso", "seshi", "hydra", "drover"]

[workspace]
members = [
    "crates/maitty-shared",
    "crates/maitty-agent-detection",
    "crates/maitty-agent-integrations",
    "crates/maitty-ipc-transport",
    "crates/maitty-core",
    "crates/maitty-terminal-client",
    "crates/maitty-settings",
    "crates/maitty-desktop-client",
    "crates/maitty-provider-codex",
    "crates/maitty-provider-claude",
    "gui/src-tauri",
]
resolver = "3"

[lib]
name = "runtime"
test = true
doctest = false

[dependencies]
maitty-terminal-client = { path = "crates/maitty-terminal-client" }

# The terminal emulator and renderer are the hot path; optimise deps even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# vt100 with one change (vendor/vt100/HYDRA.md): history from scroll regions at the top.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
