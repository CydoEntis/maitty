<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'JBM';src:url(https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Regular.woff2) format('woff2');font-weight:400}@font-face{font-family:'JBM';src:url(https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Bold.woff2) format('woff2');font-weight:700}@font-face{font-family:'NFSym';src:url(https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.2.1/patched-fonts/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf) format('truetype');size-adjust:80%}
html,body{margin:0;background:#0b0b0a;color:#c9c5bb;font-family:'JBM','JetBrains Mono',monospace}a{color:#ff6a2f}a:hover{color:#ece9e1}:focus-visible{outline:2px solid #ff6a2f;outline-offset:2px}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:10px;padding:16px 20px 32px;min-height:100vh;box-sizing:border-box;background:#0b0b0a">
  <div style="display:flex;align-items:stretch;gap:0;flex-wrap:wrap;border:1px solid #3a3934;background:#1c1c1a">
    <span style="background:#ff6a2f;color:#141413;font-weight:700;font-size:13px;padding:8px 12px;display:flex;align-items:center">seshi · checks</span>
    <button onClick="{{ prev }}" aria-label="Previous step" style="font:700 14px 'JBM',monospace;border:0;border-left:1px solid #3a3934;padding:0 14px;cursor:pointer;background:transparent;color:#ece9e1" style-hover="background:#3a3935">←</button>
    <span style="display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;color:#ff6a2f;border-left:1px solid #3a3934;white-space:nowrap">{{ stepNum }}</span>
    <span style="display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px;flex:1;min-width:240px;border-left:1px solid #3a3934"><b style="color:#ece9e1;font-size:13px">{{ stepTitle }}</b><span style="font-size:12px;color:#a7a398;line-height:1.5;text-wrap:pretty">{{ note }}</span></span>
    <button onClick="{{ next }}" aria-label="Next step" style="font:700 13px 'JBM',monospace;border:0;padding:0 18px;cursor:pointer;background:#ff6a2f;color:#141413" style-hover="background:#ff8a55">Next →</button>
  </div>
  <div style="display:flex;gap:2px">
    <sc-for list="{{ presets }}" as="p" hint-placeholder-count="18"><button onClick="{{ p.pick }}" aria-label="{{ p.name }}" title="{{ p.name }}" style="flex:1;height:6px;border:0;padding:0;cursor:pointer;background:{{ p.bar }}" style-hover="background:#ece9e1"></button></sc-for>
  </div>
  <div ref="{{ wrapRef }}" style="width:100%;overflow:auto">
    <div style="width:{{ sw }}px;height:{{ sh }}px;position:relative">
      <div ref="{{ gridRef }}" tabIndex="0" aria-label="Seshi terminal grid" onClick="{{ onClick }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:absolute;left:0;top:0;transform:scale({{ scale }});transform-origin:0 0;display:inline-block;font-family:'JBM','JetBrains Mono','NFSym',monospace;font-size:12px;line-height:16px;font-variant-ligatures:none;border:1px solid #3a3934;user-select:none;cursor:default;outline:none;background:{{ themeBg }}"><sc-for list="{{ rows }}" as="row" hint-placeholder-count="45"><div style="display:flex;height:16px;white-space:pre"><sc-for list="{{ row }}" as="r"><span style="color:{{ r.fg }};background:{{ r.bg }};font-weight:{{ r.fw }};font-style:{{ r.fs }};text-decoration:{{ r.td }};width:{{ r.wd }};flex:none;overflow:{{ r.ov }};font-size:{{ r.fz }};line-height:{{ r.lh }};text-align:{{ r.ta }};display:flex;justify-content:{{ r.ta }}">{{ r.t }}</span></sc-for></div></sc-for></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const NOTES = {
  '01 No check set': 'A project with no check looks exactly as today. fix-footer is done because the agent said so; nothing about checks appears anywhere.',
  '02 Settings: empty': 'Project settings › Check. Empty state with one line on what it does. Your own command needs no approval.',
  '03 Settings: never run': 'A command is set but has never run. It runs after the next turn ends, or now with r.',
  '04 Approve repo command': 'The command came from a cloned repo (.seshi/checks.toml). Seshi shows exactly what will run and where, and waits. Until then the session needs you (amber), not failed.',
  '05 Checking': 'The agent has stopped; Seshi is running the check. A ring sweep in blue + "checking test · 6s", distinct from the agent\'s bar spinner (add-payments).',
  '06 Passed': 'Passed: the session reads done (green ✓) with "test ✓ · 14.2s" under it. Folder name and state colour are unchanged.',
  '07 Failed': 'Failed: red ✕, "failed: test · exit 1" in bold red, and a red edge bar on the row. A question (warm-finch) is amber ● with the question text: different shape, word and colour.',
  '08 Why? (i)': 'The existing i popover, now with the check timeline: what the agent said, what Seshi ran, what it saw. Enter opens the evidence.',
  '09 Evidence': 'The sheet: result chip, command, folder, when and how long, who saw it, then the tail of the output with line numbers. Re-run, Override…, Open session.',
  '10 Long output': 'Only the tail that fits is shown, with "last N of 1,284 lines" and f for the full output in the pager.',
  '11 Printed nothing': 'A passing command that printed nothing says so and says that exit 0 passed it.',
  '12 Inbox': 'Order never changes: NEEDS YOU first, then FAILED CHECKS, then FINISHED. A failure can\'t push a question down. Selected items show their actions.',
  '13 Override?': 'Override says what it hides and where the failure stays visible. Reason optional. Applies to this result only.',
  '14 Overridden': 'The row reads ⊘ "test ✕ overridden by you"; the evidence keeps the failure with who, when and why. u undoes.',
  '15 Could not run': 'Command not found / timed out / cancelled read as "not checked" (purple ?), never as a test failure.',
  '16 Settings: missing cmd': 'Settings show the command that can\'t be found, with the last attempt and what to do.',
  '17 Stale result': 'The agent changed files after the check ran. The result stays but is marked ◷ stale until re-run.',
  '18 Room for more': 'Several checkpoints on one row: build ✓ · test ✕ · review …; at 100×30 it narrows to glyphs + the failing name (✓✕… test). Not designed further.',
};
class Component extends DCLogic {
  state = { s: null, pick: '07 Failed', fl: { theme: 'pixls', glyphs: 'unicode', style: 'flush', motion: true }, fit: true, ww: 0, hc: null };
  gridRef = React.createRef(); wrapRef = React.createRef(); timers = [];
  componentDidMount() {
    import(new URL('./checks.js', document.baseURI).href).then(m => {
      this.lib = m; let pick = m.PRESETS[0][0], W = 160, H = 45;
      try { const sv = JSON.parse(localStorage.getItem('seshi-walk') || 'null'); if (sv && m.PRESETS.find(p => p[0] === sv.p)) pick = sv.p; } catch (e) {}
      this.setState({ s: m.preset(pick, W, H, this.state.fl), pick });
      this.tick = setInterval(() => { const st = this.state.s; if (st && st.motion) this.setState({ s: { ...st, f: st.f + 1 } }); }, 140);
    }).catch(e => console.error('checks.js failed to load', e));
    this.onKey = e => {
      if (!this.lib || !this.state.s) return;
      if (e.ctrlKey && (e.key === ' ' || e.code === 'Space')) { e.preventDefault(); this.apply(this.lib.act(this.state.s, { t: 'leader' })); return; }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !this.state.s.modal) { e.preventDefault(); const n = this.lib.PRESETS.map(p => p[0]), i = n.indexOf(this.state.pick); this.go(n[Math.max(0, Math.min(n.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)))], 160, 45); return; }
      const r = this.lib.act(this.state.s, { t: 'key', key: e.key });
      if (r) { e.preventDefault(); this.apply(r); }
    };
    window.addEventListener('keydown', this.onKey);
    if (window.ResizeObserver) this.ro = new ResizeObserver(() => this.measure());
    window.addEventListener('resize', this.measureB = () => this.measure());
  }
  componentDidUpdate() { this.measure(); }
  measure() { const el = this.wrapRef.current; if (!el) return; if (this.ro && el !== this._obs) { if (this._obs) this.ro.unobserve(this._obs); this.ro.observe(el); this._obs = el; } const w = el.clientWidth; if (w > 50 && Math.abs(w - this.state.ww) > 1) this.setState({ ww: w }); }
  componentWillUnmount() { clearInterval(this.tick); window.removeEventListener('keydown', this.onKey); window.removeEventListener('resize', this.measureB); if (this.ro) this.ro.disconnect(); this.timers.forEach(clearTimeout); }
  apply(r) { if (!r) return; this.setState({ s: r.state }); (r.fx || []).forEach(f => this.timers.push(setTimeout(() => this.apply(this.lib.act(this.state.s, f.act)), f.after))); }
  go(p, W, H, fl) { fl = fl || this.state.fl; this.timers.forEach(clearTimeout); this.timers = []; this.setState({ fl, s: this.lib.preset(p, W, H, fl), pick: p }); try { localStorage.setItem('seshi-walk', JSON.stringify({ p })); } catch (e) {} if (this.gridRef.current) this.gridRef.current.focus(); }
  cell(e, out) { const el = this.gridRef.current; if (!el) return null; const r = el.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) / (r.width / out.W)), y: Math.floor((e.clientY - r.top) / (r.height / out.H)) }; }
  renderVals() {
    const s = this.state.s, lib = this.lib, fl = this.state.fl;
    const base = { gridRef: this.gridRef, wrapRef: this.wrapRef, toggleFit: () => this.setState({ fit: !this.state.fit }) };
    if (!s || !lib) return { ...base, themeBg: '#141413', stepNum: '', stepTitle: '', rows: [], sizes: [], styles: [], presets: [], themes: [], glyphs: [], onClick: null, onMove: null, onLeave: null, sw: 0, sh: 0, scale: 1, note: '', noteTitle: '', fitLabel: '', motionLabel: '', toggleMotion: null, prev: null, next: null };
    const hc = this.state.hc, out = lib.render({ ...s, hx: hc ? hc.x : null, hy: hc ? hc.y : null }); this._out = out;
    const gw = out.W * 7.22 + 2, gh = out.H * 16 + 2, ww = this.state.ww, scale = this.state.fit && ww > 50 ? Math.min(1, (ww - 4) / gw) : 1;
    const pill = on => ({ bg: on ? '#ff6a2f' : '#1c1c1a', fg: on ? '#141413' : '#c9c5bb' });
    const names = lib.PRESETS.map(p => p[0]), i = names.indexOf(this.state.pick), setFl = p => this.go(this.state.pick, s.W, s.H, { ...fl, ...p });
    return { ...base, themeBg: (lib.THEMES[s.theme] || lib.THEMES.pixls).bg, rows: out.rows, sw: Math.ceil(gw * scale), sh: Math.ceil(gh * scale), scale: scale.toFixed(4), fitLabel: this.state.fit ? 'Fit · ' + Math.round(scale * 100) + '%' : '100%',
      motionLabel: fl.motion ? 'Motion on' : 'Motion off', toggleMotion: () => setFl({ motion: !fl.motion }),
      stepNum: (i + 1) + ' / ' + names.length, stepTitle: this.state.pick.replace(/^\d+ /, ''), note: (NOTES[this.state.pick] || '') + ' Click or use the keys in the grid; ← → change step.',
      sizes: [[100, 30], [160, 45], [240, 60]].map(([W, H]) => ({ name: W + '×' + H, ...pill(s.W === W), pick: () => this.go(this.state.pick, W, H) })),
      styles: [['flush', 'Cards · flush'], ['rounded', 'Cards · rounded'], ['flat', 'Flat']].map(([k, n]) => ({ name: n, ...pill(fl.style === k), pick: () => setFl({ style: k }) })),
      themes: [['pixls', 'Pixls'], ['night', 'Night'], ['paper', 'Paper']].map(([k, n]) => ({ name: n, ...pill(fl.theme === k), pick: () => setFl({ theme: k }) })),
      glyphs: [['unicode', 'Unicode'], ['nerd', 'Nerd Font (beta)'], ['ascii', 'ASCII']].map(([k, n]) => ({ name: n, ...pill(fl.glyphs === k), pick: () => setFl({ glyphs: k }) })),
      presets: names.map((n, k) => ({ name: n, bar: k === i ? '#ff6a2f' : k < i ? '#7a3a20' : '#3a3934', pick: () => this.go(n, 160, 45) })),
      prev: () => this.go(names[Math.max(0, i - 1)], 160, 45), next: () => this.go(names[(i + 1) % names.length], 160, 45),
      onMove: e => { const c = this.cell(e, out); if (c && (!hc || c.x !== hc.x || c.y !== hc.y)) this.setState({ hc: c }); },
      onLeave: () => this.setState({ hc: null }),
      onClick: e => { const el = this.gridRef.current; if (!el) return; el.focus(); const c = this.cell(e, out), R = out.regions || []; for (let k = R.length - 1; k >= 0; k--) { const q = R[k]; if (c.x >= q.x && c.x < q.x + q.w && c.y >= q.y && c.y < q.y + q.h) { this.apply(lib.act(this.state.s, q.act)); return; } } } };
  }
}
</script>
</body>
</html>
