[workspace]
members = [
    "apps/tui",
    "apps/gui/src-tauri",
    "crates/maitty-shared",
    "crates/maitty-agent-detection",
    "crates/maitty-agent-integrations",
    "crates/maitty-ipc-transport",
    "crates/maitty-core",
    "crates/maitty-terminal-client",
    "crates/maitty-settings",
    "crates/maitty-machines",
    "crates/maitty-desktop-client",
    "crates/adapters/maitty-provider-codex",
    "crates/adapters/maitty-provider-claude",
]
resolver = "3"

# The terminal emulator and renderer are the hot path; optimise deps even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# vt100 with one change (vendor/vt100/HYDRA.md): history from scroll regions at the top.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
