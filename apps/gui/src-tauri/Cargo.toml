[package]
name = "maitty-gui"
version = "0.1.0"
description = "Optional Maitty desktop GUI"
authors = ["CydoEntis"]
license = "MIT"
repository = "https://github.com/CydoEntis/maitty"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "maitty_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.8.4" }
maitty-shared = { path = "../../../crates/maitty-shared" }
maitty-desktop-client = { path = "../../../crates/maitty-desktop-client" }
serde_json = "1"
