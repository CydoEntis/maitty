[package]
name = "maitty"
version = "0.50.5"
edition = "2024"
description = "All agents on deck: run many coding agents side by side, see which need you, keep them running when you leave"
license = "MIT"

# The app's name lives here and nowhere else (ADR 0019): the package name above is the command,
# and build.rs hands these to the code as APP_NAME, APP_TAGLINE, APP_COMMAND, APP_ENV and
# APP_PREVIOUS.
[package.metadata.brand]
name = "Maitty"
# A few words under the name: the splash and the README.
tagline = "All agents on deck"
# Commands the app had before, newest first: what an old install left is carried over.
previous = ["vibecasso", "seshi", "hydra", "drover"]

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"
pulldown-cmark = { version = "0.13", default-features = false }
bytes = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
getrandom = "0.3"
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
ignore = "0.4"
interprocess = { version = "2", features = ["tokio"] }
portable-pty = "0.9"
ratatui = "0.30"
regex = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sysinfo = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1"
vt100 = "0.16"
jsonc-parser = { version = "=0.33.1", default-features = false, features = ["cst", "serde_json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The terminal emulator and renderer are the hot path; optimise deps even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# vt100 with one change (vendor/vt100/HYDRA.md): history from scroll regions at the top.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }
