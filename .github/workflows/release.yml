# Builds the app for every platform when a version tag (v1.2.3) is pushed, and attaches the
# archives and their checksums to a GitHub Release. The install scripts download from it.
# The app's name is read from Cargo.toml (ADR 0019): the package name is the command.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15, target: x86_64-apple-darwin, archive: tar.gz }
          # Static (musl) builds run on any Linux: Ubuntu, Fedora, Arch / Omarchy, Alpine.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, archive: tar.gz, cross: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: App name
        shell: bash
        run: |
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name=$APP-${{ matrix.target }}
          mkdir -p dist/$name
          cp README.md LICENSE dist/$name/
          cp docs/theme-credits.md dist/$name/THEME-NOTICES.md
          cp vendor/herdr-detection/LICENSE dist/$name/HERDR-LICENSE.txt
          cp vendor/herdr-detection/NOTICE.md dist/$name/HERDR-NOTICES.md
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/$APP.exe dist/$name/
            (cd dist && 7z a -tzip $name.zip $name >/dev/null)
          else
            cp target/${{ matrix.target }}/release/$APP dist/$name/
            (cd dist && tar -czf $name.tar.gz $name)
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP }}-${{ matrix.target }}
          path: dist/${{ env.APP }}-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, for the notes below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: App name
        run: echo "APP=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      # What's new since the previous tag: its feat and fix commits, one "- " line each. The
      # app's update dialog shows these lines.
      - name: Release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git log --no-merges --pretty='%s' ${prev:+$prev..}"$TAG" \
            | sed -nE 's/^feat(\([^)]*\))?!?: */- New: /p; s/^fix(\([^)]*\))?!?: */- Fixed: /p' > notes.md
          [ -s notes.md ] || echo "- Small fixes and improvements." > notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum "$APP"-* > sha256sums.txt && cat sha256sums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$APP $TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi

  # Install the release just published, the way users do, and run it.
  verify:
    needs: release
    name: install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    # The installers as users get them: the public one-liners, no GitHub CLI sign-in.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The installers read <APP>_VERSION to pick this release.
      - name: App name
        shell: bash
        run: |
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "$(echo "$app" | tr 'a-z-' 'A-Z_')_VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | sh
          ~/.local/bin/$APP --version
          ~/.local/bin/$APP update --check
          ~/.local/bin/$APP doctor || true
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/install.ps1" | iex
          & "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe" --version
          & "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe" update --check
