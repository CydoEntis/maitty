[package]
name = "maitty-desktop-client"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
directories = "6"
interprocess = { version = "2", features = ["tokio"] }
maitty-ipc-transport = { path = "../maitty-ipc-transport" }
maitty-shared = { path = "../maitty-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
