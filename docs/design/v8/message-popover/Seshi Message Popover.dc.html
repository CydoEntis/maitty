<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'JBM';src:url(https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Regular.woff2) format('woff2');font-weight:400}@font-face{font-family:'JBM';src:url(https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Bold.woff2) format('woff2');font-weight:700}@font-face{font-family:'NFSym';src:url(https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.2.1/patched-fonts/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf) format('truetype');size-adjust:80%}
html,body{margin:0;background:#0b0b0a;color:#c9c5bb;font-family:'JBM','JetBrains Mono',monospace}a{color:#ff6a2f}a:hover{color:#ece9e1}:focus-visible{outline:2px solid #ff6a2f;outline-offset:2px}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:10px;padding:16px 20px 32px;min-height:100vh;box-sizing:border-box;background:#0b0b0a">
  <div style="display:flex;align-items:stretch;flex-wrap:wrap;border:1px solid #3a3934;background:#1c1c1a">
    <span style="background:#ff6a2f;color:#141413;font-weight:700;font-size:13px;padding:8px 12px;display:flex;align-items:center">seshi · message popover</span>
    <button onClick="{{ prev }}" aria-label="Previous step" style="font:700 14px 'JBM',monospace;border:0;border-left:1px solid #3a3934;padding:0 14px;cursor:pointer;background:transparent;color:#ece9e1" style-hover="background:#3a3935">←</button>
    <span style="display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;color:#ff6a2f;border-left:1px solid #3a3934;white-space:nowrap">{{ stepNum }}</span>
    <span style="display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px;flex:1;min-width:240px;border-left:1px solid #3a3934"><b style="color:#ece9e1;font-size:13px">{{ stepTitle }}</b><span style="font-size:12px;color:#a7a398;line-height:1.5;text-wrap:pretty">{{ note }}</span></span>
    <button onClick="{{ next }}" aria-label="Next step" style="font:700 13px 'JBM',monospace;border:0;padding:0 18px;cursor:pointer;background:#ff6a2f;color:#141413" style-hover="background:#ff8a55">Next →</button>
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px">
    <span style="color:#8a867c">Layout</span>
    <sc-for list="{{ layouts }}" as="z" hint-placeholder-count="4"><button onClick="{{ z.pick }}" style="font:700 12px 'JBM',monospace;border:1px solid #3a3934;padding:5px 10px;cursor:pointer;background:{{ z.bg }};color:{{ z.fg }}">{{ z.name }}</button></sc-for>
    <span style="color:#8a867c;margin-left:8px">Corners</span>
    <sc-for list="{{ corners }}" as="z" hint-placeholder-count="2"><button onClick="{{ z.pick }}" style="font:700 12px 'JBM',monospace;border:1px solid #3a3934;padding:5px 10px;cursor:pointer;background:{{ z.bg }};color:{{ z.fg }}">{{ z.name }}</button></sc-for>
    <span style="color:#8a867c;margin-left:8px">Size</span>
    <sc-for list="{{ sizes }}" as="z" hint-placeholder-count="3"><button onClick="{{ z.pick }}" style="font:700 12px 'JBM',monospace;border:1px solid #3a3934;padding:5px 10px;cursor:pointer;background:{{ z.bg }};color:{{ z.fg }}">{{ z.name }}</button></sc-for>
    <span style="color:#8a867c;margin-left:8px">Theme</span>
    <sc-for list="{{ themes }}" as="z" hint-placeholder-count="3"><button onClick="{{ z.pick }}" style="font:700 12px 'JBM',monospace;border:1px solid #3a3934;padding:5px 10px;cursor:pointer;background:{{ z.bg }};color:{{ z.fg }}">{{ z.name }}</button></sc-for>
    <span style="color:#8a867c;margin-left:8px">Glyphs</span>
    <sc-for list="{{ glyphs }}" as="z" hint-placeholder-count="3"><button onClick="{{ z.pick }}" style="font:700 12px 'JBM',monospace;border:1px solid #3a3934;padding:5px 10px;cursor:pointer;background:{{ z.bg }};color:{{ z.fg }}">{{ z.name }}</button></sc-for>
    <button onClick="{{ toggleMotion }}" style="font:700 12px 'JBM',monospace;border:1px solid #3a3934;padding:5px 10px;cursor:pointer;background:transparent;color:#c9c5bb;margin-left:8px">{{ motionLabel }}</button>
    <a href="#rules" style="margin-left:auto">Rules ↓</a>
  </div>
  <div style="display:flex;gap:2px;align-items:center">
    <sc-for list="{{ presets }}" as="p" hint-placeholder-count="8"><button onClick="{{ p.pick }}" aria-label="{{ p.name }}" title="{{ p.name }}" style="flex:1;height:18px;border:0;padding:0;cursor:pointer;background:{{ p.bar }};color:{{ p.ink }};font:700 10px 'JBM',monospace" style-hover="background:#ece9e1;color:#141413">{{ p.short }}</button></sc-for>
  </div>
  <sc-for list="{{ views }}" as="v" hint-placeholder-count="1">
    <div style="display:flex;flex-direction:column;gap:4px">
      <sc-if value="{{ v.label }}"><button onClick="{{ v.solo }}" style="align-self:flex-start;font:700 12px 'JBM',monospace;border:0;padding:2px 8px;cursor:pointer;background:#2e2d2a;color:#ece9e1" style-hover="background:#ff6a2f;color:#141413">{{ v.label }}</button></sc-if>
      <div style="width:100%;overflow:auto">
        <div style="width:{{ v.sw }}px;height:{{ v.sh }}px;position:relative">
          <div ref="{{ v.ref }}" tabIndex="0" aria-label="Seshi terminal grid" onClick="{{ v.onClick }}" onMouseMove="{{ v.onMove }}" onMouseLeave="{{ v.onLeave }}" style="position:absolute;left:0;top:0;transform:scale({{ v.scale }});transform-origin:0 0;display:inline-block;font-family:'JBM','JetBrains Mono','NFSym',monospace;font-size:12px;line-height:16px;font-variant-ligatures:none;border:1px solid #3a3934;user-select:none;cursor:default;outline:none;background:{{ v.bg }}"><sc-for list="{{ v.rows }}" as="row" hint-placeholder-count="45"><div style="display:flex;height:16px;white-space:pre"><sc-for list="{{ row }}" as="r"><span style="color:{{ r.fg }};background:{{ r.bg }};font-weight:{{ r.fw }};font-style:{{ r.fs }};text-decoration:{{ r.td }};width:{{ r.wd }};flex:none;overflow:{{ r.ov }};font-size:{{ r.fz }};line-height:{{ r.lh }};text-align:{{ r.ta }};display:flex;justify-content:{{ r.ta }}">{{ r.t }}</span></sc-for></div></sc-for></div>
        </div>
      </div>
    </div>
  </sc-for>
  <div ref="{{ wrapRef }}" style="width:100%;height:0"></div>
  <div id="rules" style="max-width:1040px;display:flex;flex-direction:column;gap:28px;font-size:13px;line-height:1.65;padding-top:24px">
    <span style="font-size:20px;font-weight:700;color:#ece9e1">Message popover · rules</span>
    <sc-for list="{{ rules }}" as="sec" hint-placeholder-count="6">
      <section style="display:flex;flex-direction:column;gap:10px">
        <span style="font-size:11px;letter-spacing:0.1em;color:#ff6a2f">{{ sec.h }}</span>
        <div style="display:flex;flex-direction:column;border:1px solid #3a3934">
          <sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="4"><div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:9px 14px;border-bottom:1px solid #2a2a27"><span style="color:#ece9e1;font-weight:700">{{ r.a }}</span><span style="text-wrap:pretty;color:#c9c5bb">{{ r.b }}</span></div></sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const NOTES = {
  '01 Empty · agent blocked': 'm on warm-finch. One input row, the agent\'s question in full above it (last 4 lines at 160×45), everything else dimmed except the row it points at. Type to try it.',
  '02 Typing · one line': 'Still one input row. The word count appears at the right of the hint row once you type.',
  '03 Typing · several lines': 'Shift+Enter adds a line; the box grows one row per line, downward, up to the cap.',
  '04 Long reply · ↑ n more': 'Past the cap (6 rows at 160×45, 4 at 100×30, 3 at 80×24) the top row becomes "↑ n more lines" and the box stops growing.',
  '05 Agent working · will queue': 'The title says "working", and one line says what Enter will do: queue until the turn ends. Ctrl+Enter sends now.',
  '06 After send · queued': 'The popover closes and the row itself carries the receipt: ◷ queued "…". No toast. Watch it turn into sent when the turn ends.',
  '07 After send · sent': '› sent "…" in accent on the row, and the agent is working again. It clears when the agent next reports.',
  '08 Row at the bottom · opens upward': 'No room below the row, so the popover flips: its bottom border sits on the row\'s last line and the pointer stays on the row.',
};
const RS = (h, rows) => ({ h, rows: rows.map(([a, b]) => ({ a, b })) });
const RULES = [
  RS('SIZE', [
    ['Width', '68 cols, or the room right of the sidebar minus 1 when that is less (72 at 100×30 → 68; 54 at 80×24 → 52). Never wider: you are replying, not writing a doc.'],
    ['Minimum height', 'One input row. Empty, the whole popover is 2 borders + label + quote + rule + 1 input + hints = 9 rows at 160×45, 8 at 100×30, 7 at 80×24.'],
    ['Growing', 'One row per line, downward, to a cap of 6 input rows (160×45), 4 (100×30), 3 (80×24). Past the cap the top input row reads "↑ n more lines" and the newest lines stay visible with the cursor.'],
    ['Agent working', 'Adds exactly one row: "<agent> is mid-turn. Enter queues this until the turn ends."'],
  ]),
  RS('THE QUOTE', [
    ['How much', 'The tail of what the agent last said, wrapped to the popover: last 4 lines at 160×45, 3 at 100×30, 2 at 80×24. The question is almost always the last sentence, so the tail is what you need.'],
    ['When it is cut', 'The label says so: "codex asked · last 3 of 5 lines". The full text is in the pane behind; Esc gets you there.'],
    ['Style', 'Not italic. A muted ▏ gutter (| in plain text) marks it as quoted; the words are in normal text colour so they are readable.'],
    ['Label', '"<agent> asked" when the agent is blocked on you, "<agent> said" otherwise. The title already names the session, so the agent name appears once in each place, not twice.'],
  ]),
  RS('PLACEMENT', [
    ['Default', 'Right of the sidebar, starting 1 col into the pane, top border one row above the session row. The ◂ pointer (< in plain text) sits on the popover\'s left border at the row\'s first line.'],
    ['Row near the bottom', 'If it would run past the last screen row, it flips: bottom border on the row\'s last line, growing upward as you type. The pointer stays on the row.'],
    ['Short screens', 'If neither fits, it is pinned to the bottom of the screen; the pointer is dropped only if the row is outside its span.'],
    ['Sidebar hidden', 'Opens from the selected session\'s row in the Inbox, or at the top-left of the pane, same rules.'],
  ]),
  RS('OVER BUSY PANE TEXT', [
    ['Dim behind', 'Everything dims with the existing modal dim except two things: the popover and the session row it points at. The row stays at full brightness so you can see what you are answering.'],
    ['Border in every layout', 'Always a full accent border, including Flat (which was the blending problem). Corners follow the Corners setting. Flat panes keep their own look; only the popover gets a border.'],
    ['Ground', 'Popover on card; the input on the terminal ground (bg), so the place you type is a clear well inside the card. No shadow.'],
  ]),
  RS('SENDING · QUEUED VS SENT', [
    ['Blocked or idle agent', 'Enter sends now. The popover closes; the row shows "› sent "…"" in accent, and the agent goes back to working.'],
    ['Working agent', 'Enter queues. The row shows "◷ queued "…"" in muted until the turn ends, then changes to "› sent". Ctrl+Enter sends now instead.'],
    ['No toast', 'The receipt lives on the row you were looking at, so it can\'t be missed or scroll away. It clears the next time the agent reports.'],
    ['Empty message', 'Enter on an empty box just closes it; nothing is sent.'],
  ]),
  RS('COLOURS (EXISTING ROLES ONLY)', [
    ['card', 'Popover ground.'],
    ['bg', 'Input well.'],
    ['accent', 'Border, title chip, ◂ pointer, › prompt, cursor, key names in the hints, "sent" on the row.'],
    ['muted', 'Quote label and gutter, placeholder, "↑ n more", word count, "queued" on the row, the agent name next to the title.'],
    ['blocked', '"● needs you" on the title border, only when the agent is waiting on you.'],
    ['text / strong', 'Quote words / what you type.'],
  ]),
  RS('KEYS (UNCHANGED)', [
    ['m', 'Open on the selected row (or from the row menu).'],
    ['Enter', 'Send (blocked/idle) or queue (working).'],
    ['Ctrl+Enter', 'Send now while the agent is working.'],
    ['Shift+Enter', 'New line.'],
    ['Esc', 'Cancel. Text is kept for that session until you send or clear it.'],
  ]),
];
const LAYOUTS = [['floating', 'Cards floating'], ['tiled', 'Cards tiled'], ['flat', 'Flat']];
class Component extends DCLogic {
  state = { s: null, pick: '01 Empty · agent blocked', fl: { theme: 'pixls', glyphs: 'unicode', layout: 'flat', corners: 'square', motion: true }, size: [160, 45], compare: false, ww: 0, hc: null };
  gridRef = React.createRef(); wrapRef = React.createRef(); timers = [];
  componentDidMount() {
    import(new URL('./msg.js', document.baseURI).href).then(m => {
      this.lib = m; let pick = this.state.pick, fl = this.state.fl, size = this.state.size, compare = false;
      try { const sv = JSON.parse(localStorage.getItem('seshi-msg') || 'null'); if (sv && m.PRESETS.find(p => p[0] === sv.p)) { pick = sv.p; fl = { ...fl, ...sv.fl }; size = sv.size || size; compare = !!sv.compare; } } catch (e) {}
      this.setState({ s: m.preset(pick, size[0], size[1], fl), pick, fl, size, compare });
      this.tick = setInterval(() => { const st = this.state.s; if (st && st.motion) this.setState({ s: { ...st, f: st.f + 1 } }); }, 140);
    }).catch(e => console.error('msg.js failed to load', e));
    this.onKey = e => {
      if (!this.lib || !this.state.s) return;
      if (e.ctrlKey && (e.key === ' ' || e.code === 'Space')) { e.preventDefault(); this.apply(this.lib.act(this.state.s, { t: 'leader' })); return; }
      if (e.key === 'Enter' && (e.ctrlKey || e.shiftKey)) { e.preventDefault(); this.apply(this.lib.act(this.state.s, { t: 'key', key: e.ctrlKey ? 'C-Enter' : 'S-Enter' })); return; }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !this.state.s.modal && !this.state.s.mopen) { e.preventDefault(); this.step(e.key === 'ArrowRight' ? 1 : -1); return; }
      const r = this.lib.act(this.state.s, { t: 'key', key: e.key });
      if (r) { e.preventDefault(); this.apply(r); }
    };
    window.addEventListener('keydown', this.onKey);
    if (window.ResizeObserver) this.ro = new ResizeObserver(() => this.measure());
    window.addEventListener('resize', this.measureB = () => this.measure());
  }
  componentDidUpdate() { this.measure(); }
  measure() { const el = this.wrapRef.current; if (!el) return; if (this.ro && el !== this._obs) { if (this._obs) this.ro.unobserve(this._obs); this.ro.observe(el); this._obs = el; } const w = el.clientWidth; if (w > 50 && Math.abs(w - this.state.ww) > 1) this.setState({ ww: w }); }
  componentWillUnmount() { clearInterval(this.tick); window.removeEventListener('keydown', this.onKey); window.removeEventListener('resize', this.measureB); if (this.ro) this.ro.disconnect(); this.timers.forEach(clearTimeout); }
  apply(r) { if (!r) return; this.setState({ s: r.state }); (r.fx || []).forEach(f => this.timers.push(setTimeout(() => this.apply(this.lib.act(this.state.s, f.act)), f.after))); }
  save() { try { localStorage.setItem('seshi-msg', JSON.stringify({ p: this.state.pick, fl: this.state.fl, size: this.state.size, compare: this.state.compare })); } catch (e) {} }
  go(p, o = {}) { const fl = o.fl || this.state.fl, size = o.size || this.state.size; this.timers.forEach(clearTimeout); this.timers = []; this.setState({ fl, size, s: this.lib.preset(p, size[0], size[1], fl), pick: p, ...(o.compare != null ? { compare: o.compare } : {}) }, () => this.save()); if (this.gridRef.current) this.gridRef.current.focus(); }
  step(d) { const n = this.lib.PRESETS.map(p => p[0]), i = n.indexOf(this.state.pick); this.go(n[(i + d + n.length) % n.length]); }
  cell(e, out) { const el = this.gridRef.current; if (!el) return null; const r = el.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) / (r.width / out.W)), y: Math.floor((e.clientY - r.top) / (r.height / out.H)) }; }
  renderVals() {
    const s = this.state.s, lib = this.lib, fl = this.state.fl;
    const base = { wrapRef: this.wrapRef };
    if (!s || !lib) return { ...base, rules: RULES, stepNum: '', stepTitle: '', note: '', views: [], layouts: [], corners: [], sizes: [], themes: [], glyphs: [], presets: [], motionLabel: '', toggleMotion: null, prev: null, next: null };
    const ww = this.state.ww, pill = on => ({ bg: on ? '#ff6a2f' : '#1c1c1a', fg: on ? '#141413' : '#c9c5bb' });
    const fit = W => { const gw = W * 7.22 + 2; return ww > 50 ? Math.min(1, (ww - 4) / gw) : 1; };
    const mk = (st, interactive, label, layout) => {
      const hc = interactive ? this.state.hc : null, out = lib.render({ ...st, hx: hc ? hc.x : null, hy: hc ? hc.y : null }), sc = fit(out.W);
      return { label, rows: out.rows, bg: (lib.THEMES[st.theme] || lib.THEMES.pixls).bg, scale: sc.toFixed(4), sw: Math.ceil((out.W * 7.22 + 2) * sc), sh: Math.ceil((out.H * 16 + 2) * sc),
        ref: interactive ? this.gridRef : null, solo: () => this.go(this.state.pick, { fl: { ...fl, layout }, compare: false }),
        onMove: interactive ? e => { const c = this.cell(e, out); if (c && (!hc || c.x !== hc.x || c.y !== hc.y)) this.setState({ hc: c }); } : null,
        onLeave: interactive ? () => this.setState({ hc: null }) : null,
        onClick: interactive ? e => { const el = this.gridRef.current; if (!el) return; el.focus(); const c = this.cell(e, out), R = out.regions || []; for (let k = R.length - 1; k >= 0; k--) { const q = R[k]; if (c.x >= q.x && c.x < q.x + q.w && c.y >= q.y && c.y < q.y + q.h) { this.apply(lib.act(this.state.s, q.act)); return; } } } : () => this.go(this.state.pick, { fl: { ...fl, layout }, compare: false }) };
    };
    const views = this.state.compare ? LAYOUTS.map(([k, n]) => mk({ ...s, layout: k }, k === s.layout, n + (k === s.layout ? ' · interactive' : ' · click to focus'), k)) : [mk(s, true, null, s.layout)];
    const names = lib.PRESETS.map(p => p[0]), i = names.indexOf(this.state.pick), setFl = p => this.go(this.state.pick, { fl: { ...fl, ...p } });
    return { ...base, views,
      stepNum: (i + 1) + ' / ' + names.length, stepTitle: this.state.pick.replace(/^\w+ /, '') + ' · ' + s.W + '×' + s.H, note: (NOTES[this.state.pick] || '') + ' ← → change step (when the popover is closed); m opens it on the selected row.', rules: RULES,
      layouts: [...LAYOUTS.map(([k, n]) => ({ name: n, ...pill(!this.state.compare && fl.layout === k), pick: () => this.go(this.state.pick, { fl: { ...fl, layout: k }, compare: false }) })), { name: 'All three', ...pill(this.state.compare), pick: () => this.go(this.state.pick, { compare: true }) }],
      corners: [['square', 'Square'], ['rounded', 'Rounded']].map(([k, n]) => ({ name: n, ...pill(fl.corners === k), pick: () => setFl({ corners: k }) })),
      sizes: [[160, 45], [100, 30], [80, 24]].map(z => ({ name: z[0] + '×' + z[1], ...pill(this.state.size[0] === z[0]), pick: () => this.go(this.state.pick, { size: z }) })),
      themes: [['pixls', 'Pixls'], ['night', 'Night'], ['paper', 'Paper']].map(([k, n]) => ({ name: n, ...pill(fl.theme === k), pick: () => setFl({ theme: k }) })),
      glyphs: [['unicode', 'Unicode'], ['ascii', 'Plain text'], ['nerd', 'Nerd Font']].map(([k, n]) => ({ name: n, ...pill(fl.glyphs === k), pick: () => setFl({ glyphs: k }) })),
      motionLabel: fl.motion ? 'Motion on' : 'Motion off', toggleMotion: () => setFl({ motion: !fl.motion }),
      presets: names.map((n, k) => ({ name: n, short: n.replace(/^\d+ /, ''), bar: k === i ? '#ff6a2f' : '#2e2d2a', ink: k === i ? '#141413' : '#8a867c', pick: () => this.go(n) })),
      prev: () => this.step(-1), next: () => this.step(1) };
  }
}
</script>
</body>
</html>
