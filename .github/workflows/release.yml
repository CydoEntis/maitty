# Builds the app for every platform when a version tag (v1.2.3) is pushed, and attaches the
# archives and their checksums to a GitHub Release. The install scripts download from it.
# The command name lives in apps/tui/Cargo.toml (ADR 0008).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # What this release carries. While apps/gui/RELEASE-HOLD exists the desktop app is left out:
  # nothing of it is built, and the desktop updater goes on being told about the last release
  # that had it (see "Update manifest" below).
  plan:
    name: release plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      desktop: ${{ steps.desktop.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check release versions
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          expected=${TAG#v}
          tui=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/tui/Cargo.toml | head -1)
          gui=$(jq -er .version apps/gui/src-tauri/tauri.conf.json)
          test "$expected" = "$tui" || { echo "Tag $TAG does not match TUI version $tui" >&2; exit 1; }
          test "$expected" = "$gui" || { echo "Tag $TAG does not match GUI version $gui" >&2; exit 1; }

      - id: desktop
        run: |
          if [ -e apps/gui/RELEASE-HOLD ]; then
            echo "The desktop app is held out of this release:"
            cat apps/gui/RELEASE-HOLD
            echo desktop=false >> "$GITHUB_OUTPUT"
          else
            echo desktop=true >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15, target: x86_64-apple-darwin, archive: tar.gz }
          # Static (musl) builds run on any Linux: Ubuntu, Fedora, Arch / Omarchy, Alpine.
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              archive: tar.gz,
              cross: true,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-musl,
              archive: tar.gz,
              cross: true,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: App name
        shell: bash
        run: |
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' apps/tui/Cargo.toml | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p maitty --bin maitty
          else
            cargo build --release --locked --target ${{ matrix.target }} -p maitty --bin maitty
          fi

      - name: Package
        shell: bash
        run: |
          name=$APP-${{ matrix.target }}
          mkdir -p dist/$name
          cp README.md LICENSE dist/$name/
          cp docs/theme-credits.md dist/$name/THEME-NOTICES.md
          cp vendor/herdr-detection/LICENSE dist/$name/HERDR-LICENSE.txt
          cp vendor/herdr-detection/NOTICE.md dist/$name/HERDR-NOTICES.md
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp target/${{ matrix.target }}/release/$APP.exe dist/$name/
            (cd dist && 7z a -tzip $name.zip $name >/dev/null)
          else
            cp target/${{ matrix.target }}/release/$APP dist/$name/
            (cd dist && tar -czf $name.tar.gz $name)
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP }}-${{ matrix.target }}
          path: dist/${{ env.APP }}-${{ matrix.target }}.${{ matrix.archive }}

  build-gui:
    name: build GUI ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-latest, platform: macos }
          - { os: ubuntu-latest, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          scripts/ci-apt-install.sh \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm wget

      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile

      # Releases also produce the signed update bundles the app downloads. The CI build on dev runs
      # without them because it has no signing key.
      - name: Build GUI installers
        working-directory: apps/gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm desktop:build --config src-tauri/tauri.updater.conf.json

      - name: Collect GUI installers
        shell: bash
        run: |
          mkdir -p dist
          ver=$(node -p "JSON.parse(require('fs').readFileSync('apps/gui/src-tauri/tauri.conf.json', 'utf8')).version")
          case "${{ runner.os }}" in
            Windows) find target/release/bundle -type f \( -iname '*.msi' -o -iname '*.exe' -o -iname '*.sig' \) -exec cp {} dist/ \; ;;
            macOS)
              find target/release/bundle -type f -iname '*.dmg' -exec cp {} dist/ \;
              # The update bundle is named after the app only; give it the version and arch.
              cp target/release/bundle/macos/Maitty.app.tar.gz "dist/Maitty_${ver}_aarch64.app.tar.gz"
              cp target/release/bundle/macos/Maitty.app.tar.gz.sig "dist/Maitty_${ver}_aarch64.app.tar.gz.sig"
              ;;
            Linux) find target/release/bundle -type f \( -iname '*.deb' -o -iname '*.rpm' -o -iname '*.appimage' -o -iname '*.sig' \) -exec cp {} dist/ \; ;;
          esac
          test -n "$(find dist -maxdepth 1 -type f -print -quit)" \
            || { echo "No GUI installers were collected" >&2; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: maitty-gui-${{ matrix.platform }}
          path: dist/*

  release:
    needs: [plan, build, build-gui]
    # A held desktop app skips build-gui, and a job that needs a skipped one is skipped as well
    # unless its own condition says otherwise.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-gui.result == 'success' || needs.plan.outputs.desktop == 'false') }}
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, for the notes below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: App name
        run: echo "APP=$(sed -n 's/^name = "\(.*\)"/\1/p' apps/tui/Cargo.toml | head -1)" >> "$GITHUB_ENV"

      # What's new since the previous tag: its feat and fix commits, one "- " line each. The
      # app's update dialog shows these lines.
      - name: Release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git log --no-merges --pretty='%s' ${prev:+$prev..}"$TAG" \
            | sed -nE 's/^feat(\([^)]*\))?!?: */- New: /p; s/^fix(\([^)]*\))?!?: */- Fixed: /p' > notes.md
          [ -s notes.md ] || echo "- Small fixes and improvements." > notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The app reads this file to learn what the newest version is and how to verify it. It asks
      # the newest release for it, so a release without the desktop app carries the newest
      # release's file forward unchanged, and desktop users stay on the version they have.
      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DESKTOP: ${{ needs.plan.outputs.desktop }}
        run: |
          if [ "$DESKTOP" != true ]; then
            gh release download --pattern latest.json --dir dist -R "$GITHUB_REPOSITORY"
            last=$(jq -er .version dist/latest.json)
            {
              echo "> The desktop app is not part of this release. Its newest installers are on [v$last](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$last)."
              echo
              cat notes.md
            } > notes.held.md
            mv notes.held.md notes.md
            cat dist/latest.json
            exit 0
          fi
          ver=${TAG#v}
          win="Maitty_${ver}_x64-setup.exe"
          mac="Maitty_${ver}_aarch64.app.tar.gz"
          lin="Maitty_${ver}_amd64.AppImage"
          for f in "$win" "$mac" "$lin"; do
            test -f "dist/$f" && test -f "dist/$f.sig" || { echo "Missing update bundle or signature: $f" >&2; exit 1; }
          done
          jq -n --arg version "$ver" --rawfile notes notes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --arg win "$win" --arg winsig "$(cat "dist/$win.sig")" \
            --arg mac "$mac" --arg macsig "$(cat "dist/$mac.sig")" \
            --arg lin "$lin" --arg linsig "$(cat "dist/$lin.sig")" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "windows-x86_64": {signature: $winsig, url: "\($base)/\($win)"},
              "darwin-aarch64": {signature: $macsig, url: "\($base)/\($mac)"},
              "linux-x86_64": {signature: $linsig, url: "\($base)/\($lin)"}}}' > dist/latest.json
          # An install made by another kind of installer asks for its own kind first
          # (`<os>-<arch>-<installer>`) and only then for the entry above, which would put a second
          # copy beside an .msi install and cannot replace a .deb or .rpm one. Each gets its entry
          # when the build signed that installer; without a signature it is left out and said.
          for kind in "windows-x86_64-msi msi" "linux-x86_64-deb deb" "linux-x86_64-rpm rpm"; do
            set -- $kind
            file=$(find dist -maxdepth 1 -type f -iname "*.$2" -printf '%f\n' | sort | head -n 1)
            if [ -n "$file" ] && [ -f "dist/$file.sig" ]; then
              jq --arg key "$1" --arg sig "$(cat "dist/$file.sig")" \
                --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file" \
                '.platforms[$key] = {signature: $sig, url: $url}' dist/latest.json > dist/latest.next.json
              mv dist/latest.next.json dist/latest.json
            else
              echo "No signed .$2 installer was built: an install made with one cannot update itself." >&2
            fi
          done
          cat dist/latest.json

      - name: Checksums
        run: cd dist && find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > sha256sums.txt && cat sha256sums.txt

      # The checksums vouch for every download and this signature vouches for the checksums: the
      # app's own `update` refuses a release whose checksums are not signed with the key built
      # into it, which is the desktop updater's. The CLI is the version the desktop build uses.
      - name: Sign the checksums
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npx --yes @tauri-apps/cli@2.12.4 signer sign dist/sha256sums.txt > /dev/null
          test -s dist/sha256sums.txt.sig
          # Checked with the program being released, so a release it would refuse is never published.
          tar -xzf "dist/$APP-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$APP-x86_64-unknown-linux-musl/$APP" verify-release dist/sha256sums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$APP $TAG" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi

  # Install the release just published, the way users do, and run it.
  verify:
    needs: release
    # Without a condition of its own this is skipped whenever build-gui was, two jobs back.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    name: install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    # The installers as users get them: the public one-liners, no GitHub CLI sign-in.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The installers read <APP>_VERSION to pick this release.
      - name: App name
        shell: bash
        run: |
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' apps/tui/Cargo.toml | head -1)
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "$(echo "$app" | tr 'a-z-' 'A-Z_')_VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh ./install.sh
          ~/.local/bin/$APP --version
          ~/.local/bin/$APP update --check
          # A real update over the install just made: download, signature, checksum, run, swap.
          ~/.local/bin/$APP update --force
          ~/.local/bin/$APP --version
          ~/.local/bin/$APP doctor || true
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe" --version
          & "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe" update --check
          # A real update over the install just made: download, signature, checksum, run, swap.
          & "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe" update --force
          if ($LASTEXITCODE -ne 0) { throw "the update failed" }
          & "$env:LOCALAPPDATA\Programs\$env:APP\$env:APP.exe" --version
