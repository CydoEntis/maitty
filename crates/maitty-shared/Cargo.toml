[package]
name = "maitty-shared"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
ratatui = "0.30"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time"] }
