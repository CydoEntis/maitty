# The verification gate on every push and pull request (see AGENTS.md).
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare GUI daemon sidecar
        working-directory: apps/gui
        run: pnpm bundle:daemon:dev
      - name: The desktop app stays off the daemon, the terminal client and settings (ADR 0048)
        shell: bash
        run: scripts/check-gui-deps.sh
      # One test at a time: CI's Windows machines stall when several tests start real
      # shells (ConPTY) at once. It also names a stuck test in the log.
      - run: cargo test --locked -- --test-threads=1
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --experimental-vm-modules --test crates/maitty-terminal-client/src/cli/integrations.test.mjs

  macos:
    name: check (macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --exclude maitty-gui --target aarch64-apple-darwin

  gui-linux:
    name: desktop GUI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm wget
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Test GUI
        working-directory: apps/gui
        run: pnpm test
      - name: Lint GUI
        working-directory: apps/gui
        run: pnpm lint
      - name: Build Linux desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build

  gui-macos:
    name: desktop GUI (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Test GUI
        working-directory: apps/gui
        run: pnpm test
      - name: Lint GUI
        working-directory: apps/gui
        run: pnpm lint
      - name: Build macOS desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build

  gui-windows:
    name: desktop GUI (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Test GUI
        working-directory: apps/gui
        run: pnpm test
      - name: Lint GUI
        working-directory: apps/gui
        run: pnpm lint
      - name: Build Windows desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build

  gui-archlinux:
    name: desktop GUI (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install Arch desktop and build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel curl dpkg file git openssl patchelf appmenu-gtk-module \
            libappindicator-gtk3 librsvg rpm-tools webkit2gtk-4.1 wget xdotool
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Test GUI
        working-directory: apps/gui
        run: pnpm test
      - name: Lint GUI
        working-directory: apps/gui
        run: pnpm lint
      - name: Build Linux desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build
