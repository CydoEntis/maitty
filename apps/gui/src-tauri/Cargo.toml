[package]
name = "maitty-gui"
version = "0.1.0"
description = "Optional Maitty desktop GUI"
authors = ["CydoEntis"]
license = "MIT"
repository = "https://github.com/CydoEntis/maitty"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "maitty_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.8.4" }
maitty-shared = { path = "../../../crates/maitty-shared" }
maitty-highlight = { path = "../../../crates/maitty-highlight" }
maitty-desktop-client = { path = "../../../crates/maitty-desktop-client" }
maitty-machines = { path = "../../../crates/maitty-machines" }
maitty-ipc-transport = { path = "../../../crates/maitty-ipc-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sysinfo = "0.37"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tauri-plugin-notification = "2.8.0"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
getrandom = "0.3"

# Desktop only: the updater and the restart after it have no mobile build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
maitty-test-support = { path = "../../../crates/maitty-test-support" }
