# The verification gate on every pull request into dev and every push to dev (see AGENTS.md).
# main only ever receives dev, which was already checked, and the release workflow
# builds it again; a change to docs alone has nothing to build.
#
# A pull request runs the jobs its files can affect (scripts/ci-areas.sh) and compiles the
# desktop app without packaging it. The installers are built on the push to dev, where a
# failure no longer holds a pull request up but still shows before a release.
#
# Build caches: only dev saves one. A pull request reads dev's, and a copy per pull request
# filled the repository's 10 GB and pushed the others out. A failed run saves what it compiled
# too, or a job that fails on dev never has a cache and compiles everything every time.
name: ci

on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches-ignore: [main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read
  pull-requests: read

# A newer push to the same branch or pull request makes the older run's answer moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      desktop: ${{ steps.areas.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
      - id: areas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A push to dev runs everything: it is what later pull requests are measured against.
          # A file list that cannot be read is empty, which the script also answers with everything.
          files=''
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)') || files=''
          fi
          scripts/ci-areas.sh <<<"$files" | tee -a "$GITHUB_OUTPUT"

  # Each job below runs unless `changes` said it has nothing to see. `!cancelled()` keeps it
  # running when `changes` itself failed: a skipped job reads as a pass.
  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare GUI daemon sidecar
        working-directory: apps/gui
        run: pnpm bundle:daemon:dev
      - name: The desktop app stays off the daemon, the terminal client and settings (ADR 0048)
        shell: bash
        run: scripts/check-gui-deps.sh
      # One test at a time: CI's Windows machines stall when several tests start real
      # shells (ConPTY) at once. It also names a stuck test in the log.
      # A test that still stalls would hold the job for its whole 45 minute limit, so the
      # step has its own, well above the 5 to 10 minutes a passing run takes.
      # Compile first, with its own limit: a cold Windows build takes longer than the 15 minutes
      # meant for running the tests, and a compile that was cut off looked like a stuck test.
      - run: cargo test --locked --no-run
        timeout-minutes: 30
      - run: cargo test --locked -- --test-threads=1
        timeout-minutes: 15
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --experimental-vm-modules --test crates/maitty-terminal-client/src/cli/integrations.test.mjs

  macos:
    name: check (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - run: cargo check --locked --workspace --exclude maitty-gui --target aarch64-apple-darwin

  gui:
    name: desktop GUI (frontend)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Test GUI
        working-directory: apps/gui
        run: pnpm test
      - name: Lint GUI
        working-directory: apps/gui
        run: pnpm lint
      - name: Typecheck and build the frontend
        working-directory: apps/gui
        run: pnpm build

  # The `test` jobs compile the desktop host on Linux and Windows, and `check (macOS)` leaves it
  # out because its Apple-only C helper does not cross-compile. This is its macOS compile.
  gui-host-macos:
    name: desktop GUI (macOS host)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.changes.outputs.desktop != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare GUI daemon sidecar
        working-directory: apps/gui
        run: pnpm bundle:daemon:dev
      - run: cargo check --locked -p maitty-gui --all-targets

  # The installers, on the push to dev only (see the top of this file).
  package-linux:
    name: desktop package (Linux)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf rpm wget
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Build Linux desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build

  package-macos:
    name: desktop package (macOS)
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Build macOS desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build

  package-windows:
    name: desktop package (Windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Build Windows desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build

  package-archlinux:
    name: desktop package (Arch Linux)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install Arch desktop and build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel curl dpkg file git openssl patchelf appmenu-gtk-module \
            libappindicator-gtk3 librsvg rpm-tools webkit2gtk-4.1 wget xdotool
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - name: Install GUI dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - name: Build Linux desktop packages
        working-directory: apps/gui
        run: pnpm desktop:build
